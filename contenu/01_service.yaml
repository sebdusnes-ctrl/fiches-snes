theme:
  id: service
  titre: "Mon service"
  description: "Maxima d’heures, heures supplémentaires, état VS, Pacte, missions."
  couleur: "#3067b7"

fiches:
  - id: suis-je-oblige
    titre: "Convocation, ordre de mission : suis-je obligé·e ?"
    resume: "Une demande n’est pas un ordre ; une convocation n’oblige que dans le cadre de votre service. Écrit, report, accompagnement : vos droits."
    en_bref:
      - "**Une demande, une invitation, un « passez me voir » ne sont pas des convocations.** Vous pouvez décliner, ou proposer un autre moment."
      - "**Une convocation n’oblige que si elle relève de votre service** (décret n° 2014-940, art. 2) : le chef d’établissement « fixe le service des personnels **dans le respect du statut** » (art. R.421-10) et ne peut pas en ajouter. Et même dans ce cadre, les textes imposent souvent une **participation**, pas une **présence** : conseils de classe et rencontres avec les parents ([fiche « Réunions »](fiche:reunions-obligatoires))."
      - "**Un ordre de mission ne crée aucune obligation de service.** Il concerne un « agent en service » qui se déplace « pour l’exécution du service, hors de sa résidence administrative et hors de sa résidence familiale » (décret n° 2006-781, art. 2) : il règle déplacement, frais et couverture en cas d’accident. Dans votre établissement, il n’a pas lieu d’être."
    textes:
      - "**Refuser** : vous devez vous conformer aux instructions, sauf ordre manifestement illégal (CGFP, art. L.121-10), mais une instruction doit rester dans le cadre de votre service. Hors de ce cadre, demandez le texte qui fonde l’obligation : sans texte, pas d’obligation."
      - "**Reporter** : aucun texte ne fixe de délai pour un simple entretien ; vous pouvez demander une autre date, par exemple pour venir accompagné·e. Contractuel·les : l’entretien préalable au licenciement a lieu au moins **5 jours ouvrables** après la convocation, qui en indique l’objet (décret n° 86-83, art. 47)."
      - "**Être accompagné·e** : c’est un **droit** dans une procédure disciplinaire (« défenseurs de son choix » : CGFP, art. L.532-4 ; décret n° 86-83, art. 44), à l’entretien préalable au licenciement d’un·e contractuel·le (« la ou les personnes de son choix », art. 47) et en rupture conventionnelle. Pour un simple entretien, **aucun texte ne l’interdit** : « tout ce qui n’est pas défendu par la loi ne peut être empêché » (Déclaration de 1789, art. 5). Venez avec un·e collègue ou un·e représentant·e syndical·e, de l’établissement ou extérieur ; pour un·e représentant·e extérieur·e, **prévenez la direction par écrit au moins 24 h avant** (règle des réunions syndicales, CGFP art. R.213-36). En cas de refus, demandez-le par écrit et ne poursuivez pas l’entretien seul·e."
    agir:
      - "Demandez **toujours par écrit** l’objet et le fondement : « S’agit-il d’une convocation ? Sur quel texte repose-t-elle ? »"
      - "Avant de refuser une convocation, contactez la section : elle vérifie avec vous et peut vous accompagner. Après un entretien, envoyez un courriel récapitulatif."
    source:
      - { doc: code_education, ref: "art. R.421-10" }
      - { doc: decret_ors, ref: "art. 2" }
      - { doc: cgfp, ref: "art. L.121-10, L.532-4, R.213-36" }
      - { doc: decret_86_83, ref: "art. 44 et 47" }
      - { doc: decret_deplacements, ref: "art. 2" }
      - { doc: ddhc, ref: "art. 5" }

  - id: maxima-de-service
    titre: "Combien d’heures dois-je faire ?"
    resume: "Maxima de service, réductions et pondérations auxquelles vous avez droit."
    en_bref:
      - "Votre service est fixé **à la semaine, pour l’année**. Il part d’un maximum hebdomadaire, diminué des réductions auxquelles vous avez droit."
      - "Maxima (décret n° 2014-940, art. 2) : **18 h** certifié·es et PLP, **15 h** agrégé·es, **20 h** professeur·es d’EPS, **17 h** agrégé·es d’EPS, **30 h + 6 h** professeur·es documentalistes. CPE (35 h) et Psy-ÉN (27 h) relèvent d’autres textes."
      - "Toute heure d’enseignement au-delà de ce maximum recalculé est une **heure supplémentaire**."
    textes:
      - "Décret n° 2014-940 du 20 août 2014 et circulaire n° 2015-057 : obligations de service des enseignant·es."
      - "**Heure « de vaisselle »** : − 1 h pour les professeur·es de SVT ou de physique-chimie qui font au moins 8 h en collège, s’il n’y a pas de personnel de laboratoire."
      - "**Complément de service** : − 1 h s’il a lieu dans une autre commune, ou dans deux autres établissements (hors même cité scolaire). Il ne peut être attribué que par le recteur et uniquement dans votre discipline de recrutement. Dans une autre discipline, **votre accord est obligatoire**."
      - "**Pondération REP+** : chaque heure faite en REP+ compte pour 1,1 h (art. 8), « afin de tenir compte du temps consacré au travail en équipe » et aux relations avec les parents. Le SNES-FSU rappelle que ce temps ne se traduit par aucune comptabilisation d’heures à rendre."
    agir:
      - "Vérifiez que toutes vos réductions figurent sur votre **état VS** avant de le signer."
      - "Un complément de service et des heures supplémentaires dans la même discipline : pour le SNES-FSU, ce cumul est contraire à l’esprit du décret. Signalez-le."
      - "**Cours annulé par une sortie scolaire** sans que vous l’accompagniez : vous ne devez aucune heure, et **une HSE faite dans la même semaine ou le même mois ne peut pas être « compensée »** par ce cours supprimé. Les maxima sont **hebdomadaires** (décret n° 2014-940, art. 2) et aucun texte ne permet cette compensation (fiche [« Sorties et voyages scolaires »](fiche:sorties-et-voyages)). En cas de refus de paiement, contactez sans hésiter la section de l’établissement ou directement la permanence du SNES-FSU."
      - "En cas de doute sur le calcul, faites-le vérifier par la section."
    source:
      - { doc: decret_ors, ref: "art. 2, 4, 8, 9" }
      - { doc: abecedaire, pages: "7, 15, 19, 24" }

  - id: heures-supplementaires
    titre: "Heures supplémentaires : HSA et HSE"
    resume: "Ce qu’on peut vous imposer… et ce que vous pouvez refuser."
    en_bref:
      - "**HSA** : heures inscrites à votre emploi du temps pour l’année et portées sur l’état VS. **Deux heures supplémentaires hebdomadaires au plus peuvent vous être imposées, « sauf empêchement pour raison de santé »** (décret n° 2014-940, art. 4-III)."
      - "**HSE** : heures ponctuelles payées à l’unité. Pour le SNES-FSU, une activité proposée en HSE peut toujours être refusée : seules les deux heures hebdomadaires ci-dessus peuvent être imposées."
      - "Seule la première HSA est majorée de 20 %. Les suivantes sont moins bien payées qu’une heure ordinaire."
    textes:
      - "Décret n° 2014-940 : est supplémentaire toute heure faite au-delà du maximum de service, réductions et pondérations comprises."
      - "**Exemptions de droit** : **raison de santé**, dont le **temps partiel thérapeutique** (décret n° 2014-940, art. 4-III ; le décret n° 86-442, art. 23-10, interdit d’ailleurs toute heure supplémentaire en TPT) ; **temps partiel**, sauf à votre demande (décret n° 82-624, art. 3 bis) ; **professeur·es documentalistes** (circulaire n° 2015-057)."
      - "**Exemptions à défendre** (SNES-FSU, sans texte qui les impose) : **décharge syndicale**, autre allègement ou réduction de service, complément de service, stagiaires, enfants en bas âge, préparation d’un concours. Pour les allègements, la circulaire n° 2015-057 compte l’heure imposable au-delà du maximum **réduit**."
      - "Les stagiaires ne sont pas censé·es avoir d’HSA."
      - "Une HSE ne peut pas servir à payer une mission particulière : celle-ci relève de l’IMP."
      - "**Heures de vie de classe** : la circulaire n° 2015-057 les classe parmi les missions liées couvertes par l’ISOE ; le SNES-FSU en revendique le paiement en HSE quand elles s’ajoutent au service (voir la [fiche dédiée](fiche:heure-de-vie-de-classe))."
    agir:
      - "Plus de 2 HSA sur votre VS sans votre accord : vous pouvez refuser celles qui dépassent."
      - "Faites valoir une exemption **par écrit** : certificat médical pour la santé, arrêté de temps partiel ou de TPT, décision de décharge syndicale."
      - "Notez vos HSE (date, objet) pour vérifier qu’elles sont bien payées."
    snes: "Les heures supplémentaires imposées alourdissent la charge de travail et sont un facteur majeur d’épuisement professionnel. Le SNES-FSU demande des postes, pas des heures supplémentaires."
    source:
      - { doc: decret_ors, ref: "art. 4" }
      - { doc: circ_ors, ref: "I" }
      - { doc: decret_temps_partiel, ref: "art. 3 bis" }
      - { doc: decret_sante, ref: "art. 23-10" }
      - { doc: snes_hs, ref: "§ 3, exemptions" }
      - { doc: abecedaire, pages: "15" }

  - id: etat-vs-emploi-du-temps
    titre: "État VS et emploi du temps"
    resume: "Les deux documents officiels de votre service, à vérifier avant de signer."
    en_bref:
      - "L’**état VS** (ventilation de service) récapitule vos classes, effectifs, heures, pondérations, réductions, HSA et IMP. Il part au rectorat et **sert à calculer votre paie**."
      - "Il doit vous être **soumis pour approbation et signature**."
      - "Avec l’état VS, l’**emploi du temps** forme le descriptif officiel de votre service pour l’année."
    textes:
      - "L’emploi du temps est établi par le ou la chef·fe d’établissement à partir des vœux des personnels."
      - "Il est fixé pour l’année (ou le semestre) et n’a pas vocation à changer. Toute modification doit rester exceptionnelle, motivée, anticipée, et **suppose l’accord des collègues concerné·es**. Un délai de prévenance d’au moins une semaine est raisonnable."
      - "Disposer d’au moins trois demi-journées libres est souhaitable, mais aucun texte ne l’impose."
    agir:
      - "Vérifiez votre VS ligne par ligne : effectifs, heures, pondérations, réductions, nombre d’HSA, IMP."
      - "Les missions du Pacte figurent sur une annexe : vérifiez qu’**aucune mission n’y a été inscrite contre votre gré**."
      - "En cas de désaccord, signez avec la mention « Vu et pris connaissance le… » et contactez la section."
    source: { doc: abecedaire, pages: "12" }

  - id: pacte-remplacements
    titre: "Pacte et remplacements de courte durée"
    resume: "Le Pacte est facultatif, et remplacer un·e collègue absent·e aussi."
    en_bref:
      - "Le Pacte repose sur le **volontariat**. Chaque mission (remplacements, Devoirs faits, stages de réussite, découverte des métiers…) est payée 1 250 € brut par an. On peut n’en prendre qu’une moitié."
      - "Une mission « remplacement » = s’engager à faire **18 h de remplacement** dans l’année (9 h pour une demi-mission), sur des créneaux que vous avez donnés."
      - "Hors Pacte, un remplacement ponctuel est payé en **HSE** et reste **volontaire**."
    textes:
      - "Décrets d’août 2023 : le ou la chef·fe d’établissement présente au **conseil d’administration** un plan annuel de remplacement de courte durée, après consultation du conseil pédagogique."
      - "Le Pacte est payé en 9 fois (d’octobre à juin), à condition d’accomplir la mission prévue… ou une autre mission du Pacte proposée par la direction."
      - "Les missions du Pacte sont inscrites sur une annexe de l’état VS."
    agir:
      - "Personne ne peut vous obliger à signer le Pacte, ni vous pénaliser si vous refusez. **Sans Pacte, un·e chef·fe d’établissement ne peut pas vous imposer de remplacement.**"
      - "En CA, veillez à ce que le plan de remplacement **n’impose rien aux collègues qui n’ont pas signé** ni à la vie scolaire."
      - "Vérifiez votre VS : aucune mission du Pacte ne doit y figurer sans votre accord."
    snes: "Le Pacte fait passer une partie de nos missions sous contrat individuel : c’est une attaque contre le statut. Le SNES-FSU appelle à le refuser."
    liens:
      - { libelle: "Plan de remplacement : l’analyse du SNES-FSU", url: "https://r.snes.edu/PlanRemplacement" }
    source: { doc: abecedaire, pages: "9, 17, 19, 22" }

  - id: missions-particulieres-imp
    titre: "Missions particulières (IMP)"
    resume: "Coordination, référent·e, laboratoires : sur la base du volontariat, avec indemnité."
    en_bref:
      - "Coordination de discipline, de cycle ou de niveau, entretien des laboratoires ou du cabinet d’histoire-géographie, référent·e culture, numérique, décrochage… : ces missions reposent sur le **volontariat**."
      - "Elles sont payées par l’**indemnité pour mission particulière (IMP)**, sans décharge de service."
      - "Cinq taux annuels : **312,50 €, 625 €, 1 250 €, 2 500 € et 3 750 €** brut, selon la charge de travail. Le taux **n’est pas proratisé** si vous êtes à temps partiel, et ne varie pas selon la « manière de servir » (circulaire n° 2015-058)."
    textes:
      - "Décret n° 2014-940, art. 3 : les missions particulières s’exercent « avec leur accord ». La circulaire n° 2015-058 indique le taux préconisé pour chaque mission."
      - "**Technologie** : en collège, un coordonnateur est obligatoirement désigné « dès lors que les équipements concernés sont utilisés par plusieurs professeurs », au taux de référence de 1 250 € (circulaire n° 2015-058)."
      - "Le SNES-FSU rappelle que le montant n’a pas été revalorisé depuis 2017."
      - "L’IMP figure sur votre état VS. Une mission particulière ne peut pas être payée en HSE."
    agir:
      - "**Les écrits font les bons amis** : avant de vous engager dans une mission, un projet ou un dispositif, déclarez-le par écrit à la direction avec la rémunération attendue, et attendez sa réponse écrite. Vous éviterez le « il n’y a plus d’argent »."
      - "**Attention aux mots** : une « demi-IMP » vaut **625 € par an**. Certaines directions annoncent une « demi-IMP » qui correspond en réalité à un quart (312,50 €). Exigez **le montant annuel en euros**, et vérifiez qu’il figure sur votre état VS : seuls les cinq montants ci-dessus existent."
      - "En CA, le vote porte sur les missions et leur taux, jamais sur les noms (voir la fiche [« IMP et décharges : ce que vote le CA »](fiche:imp-en-ca))."
    source:
      - { doc: decret_ors, ref: "art. 3" }
      - { doc: circ_imp, ref: "I et II" }
      - { doc: s3_lille, ref: "Bulletin académique n° 333" }

  - id: reunions-obligatoires
    titre: "Réunions : convoqué·e ou convié·e ? Obligatoire ou non ?"
    resume: "Une invitation n’oblige à rien. Une convocation doit reposer sur vos obligations de service. Participer n’est pas être présent."
    en_bref:
      - "**Convié·e ≠ convoqué·e.** Une invitation n’oblige à rien. Une **convocation** est une instruction de service, qui doit se rattacher à vos obligations de service. Aucun texte ne définit ces deux mots : demandez toujours lequel s’applique."
      - "**Dans le cadre du service**, le chef d’établissement peut convoquer : il « a autorité sur l’ensemble des personnels » et « fixe le service des personnels dans le respect du statut » (art. R.421-10). **Au-delà, il ne peut pas créer d’obligation.** Mais « participer » n’est pas « être présent » : voir ci-dessous."
    textes:
      - "**Conseils de classe** : la direction doit les réunir au moins trois fois par an (art. R.421-51). Vous devez y **participer** (circulaire n° 2015-057), notamment par vos appréciations au livret scolaire (art. D.111-3). Aucun texte n’impose la présence."
      - "**Parents** : c’est la direction qui organise au moins deux rencontres par an et par classe, « qui peut prendre différentes formes » (art. D.111-2). Les enseignant·es veillent à ce « qu’une réponse soit donnée aux demandes d’information et d’entrevues présentées par les parents » ; « toute réponse négative doit être motivée » (art. D.111-4). La circulaire n° 2015-057 cite « notamment les réunions parents-professeurs » parmi les échanges avec les familles, sans en faire une obligation de présence : la réunion est un moyen de répondre, pas le seul."
      - "Les équipes pédagogiques « sont réunies sous la présidence du chef d’établissement » (art. R.421-49). Pour le SNES-FSU Lille, un conseil d’enseignement n’engage que s’il est présidé par la direction et porte sur la coordination entre enseignant·es."
      - "**Conseil pédagogique, conseil école-collège, conseil de cycle 3** : la direction peut désigner des membres (art. R.421-41-1), mais ces instances ne figurent pas parmi les missions liées (circulaire n° 2015-057) : être désigné·e ne rend pas la présence obligatoire."
    agir:
      - "Pour toute réunion hors de ce cadre (réunion du soir, visio, « temps de concertation », auto-évaluation) : demandez par écrit s’il s’agit d’une convocation, et sur quel texte elle repose."
    source:
      - { doc: code_education, ref: "art. R.421-10, R.421-41-1, R.421-49, R.421-51, D.111-2 à D.111-4" }
      - { doc: circ_ors, ref: "II" }
      - { doc: reunions, pages: "1" }

  - id: examens-dnb
    titre: "Examens (DNB) : surveillance, jury, convocation"
    resume: "Obligatoires sur convocation nominative du chef de centre, sous l’autorité du recteur. Les épreuves « blanches » ne sont pas des examens."
    en_bref:
      - "Le DNB relève du **recteur** : le jury est « présidé par le recteur d’académie ou par le directeur académique des services de l’éducation nationale », qui en nomme les membres (art. D.332-19)."
      - "Participer aux jurys des examens est une « **charge normale d’emploi** » pour les personnels qualifiés (art. D.911-31)."
      - "Le chef d’établissement vous convoque alors **en tant que chef de centre**. La convocation doit être **écrite et nominative** : sans elle, pas de surveillance ni de jury (vade-mecum examens du SNES-FSU)."
    textes:
      - "Surveillance : obligatoire « dès lors qu’il y a une convocation ». Le chef de centre établit le planning en respectant en principe votre emploi du temps habituel, sans y être tenu. Vous ne surveillez pas vos propres élèves de l’année (vade-mecum)."
      - "Dispense : à demander au recteur, sous couvert du chef d’établissement ; elle n’est accordée qu’à titre exceptionnel (vade-mecum)."
      - "Les **épreuves « blanches »** (brevet blanc, oral blanc) ne sont pas des examens : voir la fiche [« Devoirs communs, brevets blancs »](fiche:devoirs-communs-examens-blancs)."
    agir:
      - "Pas de surveillance ni de jury sans convocation nominative écrite ; gardez-la : elle vous couvre en cas d’accident."
      - "Heures de surveillance au-delà de votre maximum de service dans la semaine : signalez-le à la section."
    source:
      - { doc: code_education, ref: "art. D.332-19, D.911-31" }
      - { doc: vademecum_examens, ref: "« Est-ce une obligation ? », « Pendant les épreuves »" }

  - id: demi-journees-banalisees
    titre: "Demi-journées banalisées, journée de solidarité, journées académiques : qui doit venir ?"
    resume: "Trois cas différents. Ce qui compte : le texte qui les fonde, et si vous aviez cours à ce moment-là."
    en_bref:
      - "**Journée de solidarité** : une journée, éventuellement en deux demi-journées, « **hors temps scolaire** », consacrée à la concertation sur le projet d’établissement, le contrat d’objectifs et l’orientation. Sa date est fixée par le chef d’établissement « **après consultation des équipes pédagogiques** » (arrêté du 4 novembre 2005)."
      - "**Demi-journées académiques** : jusqu’à deux demi-journées (ou un horaire équivalent) « **prises en dehors des heures de cours** », pour « des temps de réflexion et de formation sur des sujets proposés par les autorités académiques » (arrêté du 22 octobre 2025, calendrier 2026-2027)."
      - "**Demi-journée banalisée** : les cours sont suspendus pour un temps de travail commun. Elle touche à « l’organisation du temps scolaire », qui relève de l’autonomie de l’établissement, donc d’une **décision du conseil d’administration** (art. R.421-2 et R.421-20)."
    textes:
      - "**Vous aviez cours à ce moment-là** : vous êtes en service. Le temps commun remplace vos heures de cours ; il n’y a rien à « rattraper »."
      - "**Vous n’aviez pas cours à ce moment-là** : pour le SNES-FSU Lille, une demi-journée banalisée se déroule « suivant notre emploi du temps ». Aucun texte ne vous oblige à venir sur un créneau où vous n’avez pas de service. La journée de solidarité et les demi-journées académiques, elles, sont prévues **hors des heures de cours** : elles s’imposent indépendamment de votre emploi du temps."
      - "Le SNES-FSU Lille rappelle que la date de la journée de solidarité doit être fixée avant la fin du premier trimestre et annoncée en CA (note de service n° 2005-182), et que les demi-journées académiques supposent une **instruction écrite du recteur**."
    agir:
      - "Demi-journée banalisée annoncée : demandez si le CA l’a votée."
      - "Journée de solidarité : vérifiez que les équipes ont été consultées sur la date."
      - "Demi-journée « académique » : demandez l’instruction écrite du recteur et le sujet proposé."
    source:
      - { doc: arrete_solidarite, ref: "art. 1" }
      - { doc: calendrier, ref: "dispositions relatives aux enseignants" }
      - { doc: code_education, ref: "art. R.421-2, R.421-20" }
      - { doc: reunions, pages: "1" }

  - id: heure-de-vie-de-classe
    titre: "Heures de vie de classe : ce que disent vraiment les textes"
    resume: "10 h par an et par niveau, dues aux élèves, pour un temps de dialogue. Y faire entrer Pix ou l’oral du DNB sort de cet objet."
    en_bref:
      - "**Les élèves ont droit à au moins 10 heures annuelles de vie de classe par niveau** (arrêté du 19 mai 2015, annexes). C’est une obligation de l’établissement, pas d’un·e enseignant·e en particulier."
      - "Le ou la professeur·e principal·e « **peut être conduit à organiser et animer** les heures consacrées à la vie de la classe […] avec le CPE et le personnel de direction » (circulaire n° 2018-108). Le texte n’en fait pas une obligation. Et nul ne devient PP sans son accord (art. D.421-49-1)."
      - "**Leur objet est le dialogue** : elles « visent à permettre un dialogue permanent entre les élèves de la classe, entre les élèves et les enseignants […] sur toute question liée à la vie de la classe, à la vie scolaire ou tout autre sujet intéressant les élèves » (circulaire n° 2015-057)."
    textes:
      - "**Usages détournés** : préparer l’oral du DNB ou s’entraîner à Pix relève de l’enseignement ou de la certification, pas du dialogue. La formule « tout autre sujet intéressant les élèves » laisse une marge, mais ces heures ne sont pas une réserve de temps d’enseignement. **Si on y fait cours en plus de votre service, c’est une heure d’enseignement supplémentaire, à décompter et à rémunérer comme telle** : toute heure d’enseignement au-delà du maximum de service est une heure supplémentaire."
      - "**Rémunération** : la circulaire n° 2015-057 dit qu’elles « n’entrent pas dans le service d’enseignement stricto sensu », mais les range parmi les missions liées couvertes par l’ISOE. Ni le décret n° 2014-940 ni le décret ISOE ne les mentionnent."
      - "Le SNES-FSU exige leur paiement en **HSE** quand elles s’ajoutent au service, en s’appuyant sur deux réponses ministérielles antérieures (2010 et 2013). Aucun texte ne fixe de seuil d’heures pour ce paiement."
    agir:
      - "On vous demande d’utiliser les HVC pour l’oral du DNB, Pix ou un rattrapage de cours : rappelez leur définition, et demandez qu’une heure de cours soit traitée comme telle."
      - "Comptez les HVC faites en plus de votre service ; avec la section, adressez une **lettre collective** demandant leur paiement en HSE."
