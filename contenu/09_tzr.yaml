theme:
  id: tzr
  titre: "TZR"
  description: "Affectations, avis de suppléance, ISSR, frais."
  couleur: "#32b158"

fiches:
  - id: tzr-affectation
    titre: "TZR : affectation et suppléances"
    resume: "Une suppléance se rejoint, sur écrit du rectorat, après un temps de préparation."
    a_jour: "Mémo TZR 2024-2025 : vérifiez auprès de la section les règles propres à l’académie de Lille."
    en_bref:
      - "Seul le **rectorat** vous affecte, même pour un remplacement court. Un coup de téléphone d’un·e chef·fe d’établissement ne suffit pas."
      - "**Ne rejoignez une suppléance qu’avec un écrit du rectorat** (avis de suppléance ou arrêté). C’est votre ordre de mission : il couvre aussi un éventuel accident de trajet."
      - "**Rejoignez toujours votre affectation**, même si elle ne vous convient pas : un refus serait considéré comme un abandon de poste. Demandez plutôt au rectorat s’il existe une autre suppléance, et contactez la section."
    textes:
      - "Votre maximum de service est celui de votre corps (18 h certifié·es, 15 h agrégé·es), avec vos réductions et pondérations. Affecté·e à l’année : **2 HSA au plus** peuvent vous être imposées."
      - "Une affectation hors de votre discipline, ou en documentation, exige votre accord. Votre établissement de rattachement ne peut pas être changé sans votre demande (CAA Nantes, 19 février 2004)."
      - "**Entre deux remplacements**, vous pouvez être chargé·e « d’activités de nature pédagogique » dans votre établissement de rattachement, « dans la limite de [votre] obligation de service statutaire et conformément à [votre] qualification » ; chaque heure compte comme une heure de service (décret n° 99-823, art. 5)."
      - "**Remplacements de courte durée** : si vous n’êtes pas volontaire, ils ne peuvent vous être imposés qu’en attente de suppléance ou avec un service incomplet, et **uniquement par arrêté rectoral**, jamais par la seule direction."
      - "Remplaçant·e d’un·e signataire du Pacte : vous ne reprenez pas ses engagements (le Pacte est individuel)."
      - "Un **temps de préparation** préalable doit vous être accordé (note de service n° 99-152). Aucun texte n’en fixe la durée : **48 h** sont souvent admises ; le SNES-FSU demande qu’elles deviennent réglementaires."
      - "**Service déjà complet** dans l’établissement de rattachement ? La suppléance ne s’y ajoute pas, elle le remplace ; au-delà, ce sont des heures supplémentaires."
    agir:
      - "Demandez par écrit un **emploi du temps hebdomadaire** et un **état VS**, y compris entre deux remplacements : ils prouvent votre service et couvrent un éventuel accident de service."
      - "Datez toujours votre signature de l’avis de suppléance : écrivez « Vu et pris connaissance le… » avec la date réelle, et gardez avis et états VS pour contrôler vos paies."
    source:
      - { doc: decret_tzr, ref: "art. 3 à 5" }
      - { doc: memo_tzr, pages: "5 à 9" }

  - id: tzr-indemnites
    titre: "TZR : ISSR et frais de déplacement"
    resume: "L’indemnité journalière de remplacement, et le remboursement des trajets en affectation à l’année."
    a_jour: "Montants du Mémo TZR 2024-2025, à vérifier pour l’année en cours."
    en_bref:
      - "**ISSR** (indemnité de sujétions spéciales de remplacement) : une indemnité **par jour de remplacement**, hors de votre établissement de rattachement. Son montant dépend de la distance."
      - "Elle est due pour une **suppléance de courte ou moyenne durée**, ou pour une affectation à l’année **commencée après la rentrée**."
      - "Elle n’est **pas** due pour une affectation à l’année dès la rentrée, ni pour une suppléance dans votre établissement de rattachement."
    textes:
      - "Taux journaliers (2024) : moins de 10 km = 15,94 € ; 10-19 km = 21,04 € ; 20-29 km = 26,16 € ; 30-39 km = 30,87 € ; 40-49 km = 36,86 € ; 50-59 km = 42,89 € ; 60-80 km = 49,24 € ; + 7,34 € par tranche de 20 km au-delà."
      - "La distance retenue est la distance par la route entre la commune de rattachement et celle du remplacement."
      - "**Affectation à l’année hors de votre commune** : vos frais de déplacement sont remboursés (au tarif des indemnités kilométriques s’il n’y a pas de transport en commun adapté), ainsi que vos repas pris hors de la commune entre 11 h et 14 h."
    agir:
      - "Remplacement commencé après la rentrée et prévu jusqu’en fin d’année : vérifiez que l’arrêté n’est **pas antidaté** au 1er septembre. Cela vous priverait de l’ISSR."
      - "Faites indiquer sur le procès-verbal d’installation la date réelle de votre prise de fonctions."
      - "ISSR non versée : réclamez-la au service gestionnaire du rectorat et prévenez la section."
    source:
      - { doc: decret_issr, ref: "art. 2 et 5" }
      - { doc: memo_tzr, pages: "12 à 14" }
