theme:
  id: etablissement
  titre: "Vie de l’établissement"
  description: "Conseils, organisation pédagogique, Devoirs faits, cahier de textes, Pronote."
  couleur: "#3067b7"

fiches:
  - id: conseil-de-classe
    titre: "Conseils de classe : participation n’est pas présence"
    resume: "Les textes parlent de « participation ». Aucun n’emploie le mot « présence » ni ne fixe de nombre minimum."
    en_bref:
      - "Les enseignant·es de la classe sont **membres** du conseil de classe (art. R.421-50). Il se réunit **au moins trois fois par an**, et chaque fois que le chef d’établissement le juge utile (art. R.421-51)."
      - "Les textes de service parlent de **« participation »** : la circulaire n° 2015-057 range dans les missions liées « la participation aux réunions d’équipes pédagogiques, qu’elles prennent ou non la forme d’instances identifiées telles que […] les conseils de classe »."
      - "**Aucun texte n’emploie le mot « présence »** à propos des conseils de classe, et aucun ne fixe un nombre minimum de conseils à suivre. Les chefs d’établissement jouent souvent sur ces mots."
    textes:
      - "Décret n° 2014-940, art. 2-II : les missions liées comprennent « le travail au sein d’équipes pédagogiques constituées d’enseignants ayant en charge les mêmes classes ou groupes d’élèves »."
      - "Art. R.421-51 : le conseil examine le suivi des acquis et la scolarité de chaque élève. Le ou la **professeur·e principal·e, ou un représentant de l’équipe pédagogique**, expose les résultats : le texte ne suppose pas que chaque enseignant·e présente lui-même ses élèves."
      - "Participer passe d’abord par vos **appréciations au livret scolaire**, par lequel les parents sont informés (art. D.111-3). C’est la direction qui a l’obligation de réunir le conseil ; votre obligation est d’y contribuer, pas d’y être physiquement présent·e."
    agir:
      - "Si l’on vous parle de « présence obligatoire », demandez le texte : les textes disent « participation »."
      - "Absent·e, transmettez vos appréciations et observations par écrit au ou à la professeur·e principal·e, et gardez une trace de cet envoi."
      - "Le conseil peut être un vrai moment d’échange entre collègues, pas une simple chambre d’enregistrement."
    source:
      - { doc: code_education, ref: "art. R.421-50, R.421-51, D.111-3" }
      - { doc: decret_ors, ref: "art. 2" }
      - { doc: circ_ors, ref: "II" }
      - { doc: abecedaire, pages: "9" }

  - id: punitions
    titre: "Punitions : votre compétence, à ne pas confondre avec les sanctions"
    resume: "Les punitions relèvent de l’enseignant·e. Exclure un élève de cours suppose sa prise en charge : le « ramener » en classe la vide de son sens."
    en_bref:
      - "**Punition ≠ sanction.** Les punitions visent « les manquements mineurs » et « les légères perturbations ». Ce sont de « simples mesures d’ordre intérieur » : pas de recours devant le juge, pas d’inscription au dossier de l’élève. Les sanctions relèvent du chef d’établissement ou du conseil de discipline (fiche [« Sanctions disciplinaires et sursis »](fiche:sanctions-et-sursis))."
      - "**Elles relèvent de vous** : les punitions « peuvent être prononcées par les personnels de direction, d’éducation, de surveillance et par les enseignants, **à leur propre initiative** ». « Le respect des règles applicables dans la classe est de la responsabilité de l’enseignant »."
      - "**Liste** : observation ou rapport sur le carnet de correspondance ; excuse publique orale ou écrite ; devoir supplémentaire (corrigé par qui l’a donné) ; observation ; retenue ; **exclusion de cours**. Cette liste nationale est indicative (« d’autres punitions peuvent éventuellement être prononcées ») : c’est le **règlement intérieur** qui fixe celles de l’établissement. Les parents en sont informés par écrit."
    textes:
      - "**Exclusion de cours** : « dans des cas très exceptionnels », elle « s’accompagne **nécessairement** d’une prise en charge de l’élève dans le cadre d’un dispositif prévu à cet effet et connu de tous » (circulaire n° 2014-059) ; l’élève « doit réaliser un devoir **dans l’établissement** pendant son exclusion » (service-public.fr). Ne pas la confondre avec l’exclusion temporaire **de la classe**, qui est une sanction."
      - "**Interdits** : la note zéro pour un motif exclusivement disciplinaire ; les punitions collectives (une punition est individuelle, mais peut concerner plusieurs élèves)."
      - "**Rôle de la direction** : soumettre au CA les principes de choix des punitions, et organiser le dispositif de prise en charge des élèves exclus de cours. **Aucun texte ne prévoit qu’elle annule une punition** prononcée par un·e enseignant·e."
    agir:
      - "**Élève exclu de cours « ramené » en classe** : vous pouvez **vous opposer à son retour** (la punition relève de vous). Faites-le reconduire à la vie scolaire, jamais seul : tant qu’il n’est pas pris en charge, vous en êtes responsable."
      - "Retour imposé : demandez par écrit quel est le « dispositif prévu à cet effet » et remplissez une fiche [RSST](fiche:registre-sst) : être désavoué·e devant la classe est un **risque psychosocial**. Gardez une trace écrite de chaque punition."
      - "Manquements répétés ou graves : demandez par écrit une procédure disciplinaire ; un refus doit être motivé (art. D.511-30, fiche [« Conseil de discipline »](fiche:conseil-de-discipline))."
    source:
      - { doc: circ_regle, ref: "I-2 « Le régime des punitions »" }
      - { doc: service_public_punitions, ref: "« La punition »" }
      - { doc: code_education, ref: "art. R.421-5, D.511-30" }

  - id: conseil-pedagogique
    titre: "Conseil pédagogique"
    resume: "Une instance consultative : elle propose, c’est le CA qui décide."
    en_bref:
      - "Le conseil pédagogique est présidé par le ou la chef·fe d’établissement. Il réunit au moins un·e PP par niveau, un·e professeur·e par champ disciplinaire et un·e CPE."
      - "Les équipes pédagogiques ont **15 jours après la rentrée** pour proposer des volontaires, que la direction désigne ensuite."
      - "Il **donne des avis et fait des propositions** au conseil d’administration. Il ne décide pas à sa place."
    textes:
      - "Loi d’orientation de 2005, décret du 27 janvier 2010, modifié par le décret du 22 octobre 2014."
      - "Sa mission : favoriser la concertation et coordonner les enseignements. Il prépare la partie pédagogique du projet d’établissement."
    agir:
      - "La **liberté pédagogique**, reconnue par la loi, doit être respectée : le conseil pédagogique ne peut pas imposer des pratiques ou des modes d’évaluation."
      - "Refusez toute « hiérarchie intermédiaire » entre collègues."
      - "Ce qui relève du CA (ou de la commission permanente) doit y être débattu et voté."
    snes: "Le SNES-FSU s’est opposé à la création de ce conseil, qui sert plus souvent à imposer qu’à concerter."
    source: { doc: abecedaire, pages: "9" }

  - id: organisation-pedagogique
    titre: "Groupes de besoins, soutien, AP : c’est le CA qui décide"
    resume: "Depuis mars 2026, les groupes de besoins sont facultatifs. L’organisation se vote en CA."
    en_bref:
      - "Depuis l’arrêté du **10 mars 2026**, l’accompagnement en français et mathématiques en 6e et 5e « **peut** donner lieu » à des groupes à effectifs réduits ou constitués selon les besoins : les **groupes de besoins sont facultatifs** (arrêté du 19 mai 2015 modifié)."
      - "L’organisation en classes et en groupes relève de l’autonomie de l’établissement, donc du **conseil d’administration** (code de l’éducation, art. R.421-2 et R.421-20), et non du seul chef d’établissement."
      - "Le **soutien** (jusqu’à 2 h par semaine) et l’heure de **soutien ou approfondissement** en 6e sont eux aussi facultatifs, et sans moyens dédiés."
    textes:
      - "L’**accompagnement personnalisé** n’est plus maintenu qu’en 4e et 3e (décret du 4 avril 2025). Il est organisé par le conseil pédagogique et acté par le CA, sans moyens dédiés."
      - "Le « renforcement » en 4e et 3e n’a pas d’organisation précise : il peut correspondre à Devoirs faits ou au soutien."
      - "Le **projet local d’évaluation** (PLE) et tout protocole d’harmonisation des évaluations **n’ont aucune existence réglementaire au collège**."
      - "Les évaluations nationales (obligatoires en 6e, 5e et 4e) servent à calculer un indice de « valeur ajoutée » des collèges. **Ev@lang** (anglais) et **Pix** s’y ajoutent."
    agir:
      - "Votre **liberté pédagogique** est reconnue par la loi. La direction ne peut pas vous prescrire une pratique, par exemple sortir les élèves les plus faibles pour des groupes de niveau."
      - "Soyez vigilant·es en CA : rien de tout cela ne peut être imposé sans vote."
      - "Refusez collectivement un PLE ou un protocole d’harmonisation des évaluations."
    snes: "Le SNES-FSU demande que l’aide aux élèves se fasse dans le temps de la classe, avec des effectifs allégés et des dédoublements financés, sans réduire les horaires disciplinaires."
    source:
      - { doc: arrete_college, ref: "version en vigueur" }
      - { doc: code_education, ref: "art. R.421-2, R.421-20" }
      - { doc: abecedaire, pages: "3, 12, 14, 22, 24" }

  - id: devoirs-faits
    titre: "Devoirs faits"
    resume: "Obligatoire pour les élèves de 6e, volontaire pour les enseignant·es."
    en_bref:
      - "Devoirs faits est **obligatoire pour les élèves de 6e** et volontaire pour les autres niveaux."
      - "Pour les enseignant·es, c’est du **volontariat**, payé en **HSE** ou dans le cadre du Pacte (mission de 24 h par an)."
      - "Il existe une enveloppe d’HSE dédiée à Devoirs faits : mieux vaut l’utiliser que le Pacte."
    textes:
      - "Professeur·es, CPE, assistant·es pédagogiques et AED peuvent l’encadrer, ainsi que des volontaires du service civique (au plus deux par établissement) et des associations agréées."
      - "Le livret qui prévoit l’intervention des AESH n’a **aucune valeur réglementaire** : elles et ils peuvent refuser."
    agir:
      - "À la rentrée, demandez comment Devoirs faits est organisé dans l’établissement."
      - "Si vous encadrez des volontaires du service civique, demandez à être rémunéré·e pour ce tutorat."
    source: { doc: abecedaire, pages: "3, 10" }

  - id: cahier-de-textes-pronote
    titre: "Cahier de textes, Pronote : vos obligations"
    resume: "Contenu des séances et travail à faire : oui. Mettre tout son cours en ligne : non."
    en_bref:
      - "Remplir le **cahier de textes numérique** est une obligation de service depuis 2010."
      - "Il doit indiquer **le contenu de la séance** et **le travail à faire**, ainsi que les sujets des devoirs et des contrôles."
      - "**Aucune obligation d’y déposer votre cours**, même au nom de la « continuité pédagogique »."
    textes:
      - "C’est une circulaire qui encadre le cahier de textes : les documents et ressources supplémentaires sont « à l’initiative du professeur »."
      - "Pronote n’est pas un ENT. Le choix d’y recourir devrait au moins être débattu en conseil d’administration."
    agir:
      - "Le paramétrage de Pronote (évaluation, messagerie) doit respecter votre **droit à la déconnexion** : il ne peut pas dicter vos pratiques."
      - "Vous pouvez demander que l’usage de Pronote et son paramétrage soient discutés en CA."
    source: { doc: abecedaire, pages: "5, 21" }

  - id: continuite-pedagogique
    titre: "Élève absent : faut-il tout mettre en ligne ?"
    resume: "Non. La « continuité pédagogique » ne vise pas les absences individuelles d’élèves."
    en_bref:
      - "Dans les textes officiels, la **continuité pédagogique ne s’applique pas aux absences d’un ou de quelques élèves**."
      - "Le cahier de textes doit indiquer le contenu de la séance, le travail à faire et les documents distribués qui ne sont pas dans le manuel. Il **n’a pas à contenir l’intégralité du cours**."
      - "Aucun texte ne permet d’exiger que vous mettiez en ligne votre cours, la trace écrite ou les activités de la séance."
    textes:
      - "Circulaire de 2010 sur le cahier de textes numérique : quand elle parle de continuité, c’est pour la **suppléance d’un professeur** absent ou muté, pas pour un élève absent."
      - "En cas de fermeture d’établissement, les personnels restent maîtres des modalités : **la visio ne peut pas être imposée**. La liberté pédagogique (art. L.912-1-1 du code de l’éducation) reste la règle."
    agir:
      - "Face à une demande de famille relayée par la direction, rappelez le cadre : contenu de séance, travail à faire, documents distribués."
      - "Aider un élève absent longtemps est une **responsabilité de l’institution** (dispositifs, moyens), pas une tâche individuelle à absorber en plus."
    snes: "Créer des cours pour l’ENT ou pour des élèves absents est un autre métier que d’enseigner en classe. C’est du travail invisible, que l’institution laisse glisser vers les enseignant·es."
    source:
      - { doc: continuite, ref: "4 pages" }
      - { doc: s3_lille, ref: "« Continuité pédagogique, fermeture des établissements » (2021)" }

  - id: devoirs-communs-examens-blancs
    titre: "Devoirs communs, brevets blancs : obligatoires ?"
    resume: "Non. Ils relèvent de l’initiative des équipes, et leur surveillance hors service se paie en HSE."
    en_bref:
      - "Devoirs communs et examens blancs sont **une modalité possible, non obligatoire**, de l’évaluation des élèves."
      - "C’est **aux équipes pédagogiques, et à elles seules**, de décider s’il y en a, d’en fixer les modalités, le contenu et la répartition des tâches."
      - "Le chef d’établissement peut faciliter leur organisation, mais **ne peut en imposer ni le principe ni les modalités**."
    textes:
      - "Art. L.912-1 du code de l’éducation : les professeur·es procèdent à l’évaluation de leurs élèves. Décret n° 2014-940 : c’est une mission liée."
      - "La circulaire n° 2015-057 parle de « la participation à des dispositifs d’évaluation », c’est-à-dire **certains**, pas tous : le SNES-FSU a obtenu que les examens blancs n’y soient pas mentionnés."
      - "Le conseil pédagogique ne peut porter atteinte à la liberté pédagogique (art. L.912-1-1). Le projet d’établissement doit « respecter le caractère individuel de l’acte pédagogique » (circulaire n° 90-108)."
    agir:
      - "**Surveillance** : sur vos heures de cours, à la place de ces heures, pas de paiement supplémentaire. **En dehors de votre service**, elle ne peut pas vous être imposée et doit être payée en **HSE**."
      - "L’évaluation du contrôle continu (DNB compris) relève de la seule responsabilité des professeur·es."
    source:
      - { doc: faq_snes, ref: "« Devoirs communs, brevets ou bacs blancs »" }
      - { doc: reunions, pages: "1" }

  - id: sorties-et-voyages
    titre: "Sorties et voyages scolaires"
    resume: "Liberté pédagogique, vote du CA, et rien à « rattraper »."
    en_bref:
      - "Organiser une sortie ou un voyage relève de la **liberté pédagogique** : personne ne peut vous l’imposer."
      - "Le CA donne son accord sur la **programmation et le financement**. Le chef d’établissement autorise la sortie. Tout l’argent passe par l’agent·e comptable (jamais par un FSE ou une coopérative)."
      - "**La régie** : un·e **régisseur**, nommé·e par le chef d’établissement avec l’agrément de l’agent·e comptable (art. R.421-70), encaisse les paiements des familles (régie de **recettes**) ou paie sur place (régie d’**avances**). Hors régie, ne collectez jamais d’argent."
      - "Le coût du voyage des **accompagnateurs** est pris sur le budget de l’établissement : **vous n’avez pas à payer pour travailler**."
    textes:
      - "Circulaires du 13 juin 2023 et du 16 juillet 2024, guide Éduscol. Après chaque voyage, questionnaire « Brisons le silence » remis aux élèves (décret du 13 mai 2026)."
      - "Une sortie sur le temps scolaire qui complète l’enseignement est obligatoire, donc gratuite. Sorties facultatives : les **fonds sociaux** peuvent aider les familles qui ne peuvent pas payer."
      - "**Votre classe est partie sans vous ?** Vous ne devez aucune heure : présent·e dans l’établissement, vous êtes en service, et le service est hebdomadaire (décret n° 2014-940). Idem en formation (EAFC)."
      - "S’il souhaite **déplacer le cours** sur un autre créneau de la même semaine, le chef d’établissement doit obtenir **votre accord**, respecter un délai de prévenance d’au moins 48 h ouvrables et vous remettre une **modification écrite de la VS**, contre signature, sans dépasser votre horaire hebdomadaire. **Une modification sur Pronote ne fait pas foi, un planning envoyé par courriel non plus.**"
      - "**Pourquoi la VS ?** Elle fonde votre paie et atteste où et quand vous êtes en service (accident) : **rien n’y change sans votre signature**. Sinon, soyez simplement présent·e sur le créneau libéré ([État VS et emploi du temps](fiche:etat-vs-emploi-du-temps))."
      - "Prendre une autre classe, ou une de vos classes en plus de votre horaire, suppose **votre accord** et se paie en **HSE**. Cette HSE ne peut pas être « compensée » par le cours supprimé pendant la sortie : aucun texte ne le permet. En cas de refus, contactez la section ou la permanence du SNES-FSU."
    agir:
      - "Refusez qu’un voyage soit conditionné au remplacement des collègues absents, ou qu’on impose aux accompagnateurs de « rattraper » leurs cours : rien de tout cela n’est réglementaire."
      - "Faites voter en début d’année une programmation de principe des sorties, et la prise en charge des accompagnateurs au budget."
    source:
      - { doc: agir_ca, pages: "22" }
      - { doc: abecedaire, pages: "12" }
      - { doc: code_education, ref: "art. R.421-70" }
      - { doc: faq_snes, ref: "« Rattrapage des cours après une sortie »" }
      - { doc: s3_lille, ref: "Bulletins académiques n° 326 et 333" }

  - id: quart-heure-lecture
    titre: "« Quart d’heure lecture » : peut-on l’imposer ?"
    resume: "Aucun texte ne l’impose : c’est un choix d’équipe volontaire, pas une injonction."
    en_bref:
      - "Le « quart d’heure lecture » (« Silence, on lit », « Chut, on lit » dans l’académie de Lille) **ne fait l’objet d’aucune réglementation** : rien ne permet de l’imposer."
      - "Mis en place par un travail collectif ou par des collègues volontaires hors des cours, il relève de la **liberté pédagogique**."
      - "Pris sur les heures de cours, il **réduit des horaires disciplinaires** pourtant obligatoires."
    textes:
      - "C’est une commande institutionnelle (courrier ministériel de 2018, incitations rectorales). L’association « Silence, on lit » n’a pas d’agrément de l’Éducation nationale."
      - "Aucune étude étayée n’en mesure les effets : il n’existe que des témoignages."
    agir:
      - "Pressions en conseil pédagogique ou en CA pour le généraliser : rappelez qu’aucun texte ne l’impose et que les horaires d’enseignement sont réglementaires."
      - "Si le climat scolaire est en cause, demandez de vrais moyens : vie scolaire, effectifs réduits, dédoublements."
    snes: "Un dispositif « magique » ne remplace ni l’accompagnement des élèves en difficulté de lecture, ni les moyens."
    source: { doc: s3_lille, ref: "« Silence on lit, Quart d’heure lecture… De quoi parle-t-on ? »" }

  - id: manuels-numerique
    titre: "Manuels et outils numériques : qui choisit ?"
    resume: "Le CA donne un avis sur les principes. Ce sont les équipes qui choisissent."
    en_bref:
      - "Le CA donne son **avis sur les principes** de choix des manuels, logiciels et outils pédagogiques, y compris numériques (art. R.421-23). **Ce sont les équipes qui choisissent** ce qu’elles utilisent."
      - "Au collège, les manuels sont gratuits pour les familles : l’État verse une subvention à chaque établissement."
      - "Rentrée 2026 : environ **41 € par élève de 5e** pour renouveler deux manuels (français et maths). Les crédits pédagogiques de l’État sont en forte baisse."
    textes:
      - "Les outils numériques relèvent du choix des enseignant·es et de leur liberté pédagogique : une collectivité ne peut pas imposer des manuels, logiciels ou applications non choisis par les équipes."
      - "Reproduction d’œuvres protégées : circulaire n° 2004-055 du 25 mars 2004."
    agir:
      - "En CA, demandez le montant de l’enveloppe reçue pour les manuels et expliquez aux parents ce qu’elle permet réellement."
      - "Défendez la liberté de choix entre papier et numérique."
    source: { doc: agir_ca, pages: "21" }
