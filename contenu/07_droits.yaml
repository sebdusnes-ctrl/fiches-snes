theme:
  id: droits
  titre: "Droits syndicaux et libertés"
  description: "Heure d’info syndicale, stages, devoir de réserve, cumul, élections."
  couleur: "#ed0f4c"

fiches:
  - id: heure-information-syndicale
    titre: "L’heure d’information syndicale (HIS)"
    resume: "Une heure par mois sur votre temps de service. Enseignant·es : prévenir la direction 48 h avant."
    en_bref:
      - "Chaque agent public, **titulaire ou non, enseignant·e ou non**, a le droit de participer à une réunion mensuelle d’information syndicale, **dans la limite d’une heure par mois**, sur son temps de service (CGFP, art. R.215-12)."
      - "La section organise la réunion **en concertation avec le chef d’établissement, au moins une semaine avant** la date retenue (circulaire n° 2014-120)."
      - "**Enseignant·es** : vous devez **prévenir le chef d’établissement au moins 48 heures avant** si vous souhaitez y participer (même circulaire). CPE, documentalistes, AED, personnels administratifs : droit commun, une heure par mois."
    textes:
      - "La réunion ne doit pas entraîner la fermeture de l’établissement : l’accueil et la surveillance des élèves restent assurés (circulaire n° 2014-120)."
      - "Un·e **représentant·e syndical·e extérieur·e** à l’établissement, mandaté·e par le syndicat, peut animer la réunion : la direction doit être informée de sa venue **au moins 24 heures avant** (CGFP, art. R.213-36)."
      - "**Avant les élections professionnelles** (six semaines avant le scrutin), chaque agent peut assister en plus à une réunion d’information spéciale d’une heure (CGFP, art. R.215-14)."
      - "Le SNES-FSU rappelle que l’ordre du jour de la réunion n’a pas à être communiqué à la direction."
    agir:
      - "Surveillez le panneau syndical : les dates des HIS y sont affichées."
      - "Prévenez la direction 48 h avant par écrit (un simple courriel suffit), et vos élèves si vous avez cours."
    liens:
      - { libelle: "Le droit syndical dans l’établissement", url: "https://www.snes.edu/agissons/outils/le-droit-syndical-dans-l-etablissement" }
    source:
      - { doc: cgfp, ref: "art. R.213-36, R.215-12 à R.215-14" }
      - { doc: circ_his, ref: "2.1 et 2.2" }

  - id: stage-syndical
    titre: "Stage de formation syndicale : 12 jours par an"
    resume: "Un droit pour tout agent en activité, adhérent·e ou non. Demande écrite un mois avant."
    en_bref:
      - "Tout agent public en activité, **titulaire ou contractuel**, a droit à un congé pour formation syndicale **avec traitement**, de **12 jours ouvrables par an** au plus (CGFP, art. L.215-1)."
      - "La demande est adressée **par écrit au moins un mois avant** le stage. **Sans réponse le 15e jour avant le stage, le congé est accordé** (art. R.215-3)."
      - "Il ne peut être refusé que si **les nécessités du fonctionnement du service** s’y opposent ; le refus est motivé et communiqué à la commission paritaire (art. R.215-4)."
    textes:
      - "Le stage doit être organisé par un centre ou institut figurant sur une liste arrêtée par le ministre (art. R.215-1). La section vous indique les modalités pour chaque stage."
      - "À la fin du stage, une attestation de présence vous est remise : donnez-la à votre administration à votre retour (art. R.215-5)."
    agir:
      - "Repérez les stages proposés par la section départementale ou académique, et envoyez votre demande dans les délais."
      - "Refus : demandez-en le motif écrit et contactez la section."
    source: { doc: cgfp, ref: "art. L.215-1, R.215-1 à R.215-5" }

  - id: devoir-de-reserve
    titre: "Obéir, se conformer, « devoir de réserve » : ce que dit vraiment le droit"
    resume: "Les militaires obéissent. Les professeur·es se conforment aux instructions, avec la liberté pédagogique dans la manière d’y parvenir."
    en_bref:
      - "**Les militaires obéissent** : ils « doivent obéissance aux ordres de leurs supérieurs » (code de la défense, art. L.4122-1)."
      - "**Les agents publics se conforment** : « L’agent public doit **se conformer aux instructions** de son supérieur hiérarchique, sauf dans le cas où l’ordre donné est manifestement illégal et de nature à compromettre gravement un intérêt public » (CGFP, art. L.121-10). Le mot « obéissance » ne figure pas dans le statut."
      - "**Les professeur·es gardent la liberté de la manière** : « la liberté pédagogique de l’enseignant s’exerce dans le respect des programmes et des instructions » (code de l’éducation, art. L.912-1-1). Le conseil pédagogique ne peut y porter atteinte."
    textes:
      - "**Pas de « devoir de réserve » dans le statut** : le Code général de la fonction publique n’en parle pas. C’est une construction de la jurisprudence, appréciée au cas par cas et bien plus stricte pour les hauts fonctionnaires qui représentent l’État. La liberté d’opinion est garantie (art. L.111-1)."
      - "Le code impose en revanche : dignité, impartialité, intégrité et probité (art. L.121-1) ; neutralité et laïcité dans l’exercice des fonctions (art. L.121-2) ; discrétion professionnelle (art. L.121-7) ; secret professionnel (art. L.121-6)."
      - "Une instruction doit rester dans le cadre de vos missions et de votre statut. Hors du cas d’un ordre manifestement illégal, on s’y conforme d’abord, puis on la conteste."
    agir:
      - "Si l’on vous oppose un « devoir de réserve », de « loyauté » ou d’« obéissance », demandez sur quel texte il repose."
      - "Instruction qui touche à vos choix pédagogiques ou sort de vos missions : demandez-la par écrit et contactez la section."
    source:
      - { doc: cgfp, ref: "art. L.111-1, L.121-1 à L.121-10" }
      - { doc: code_education, ref: "art. L.912-1-1" }
      - { doc: code_defense, ref: "art. L.4122-1" }
      - { doc: obeissance, ref: "3 pages" }

  - id: cumul-activites
    titre: "Cumul d’activités : ce qui est permis"
    resume: "Les œuvres de l’esprit sont libres. Une activité accessoire, comme des cours, demande une autorisation."
    en_bref:
      - "Un agent public ne peut pas exercer, à titre professionnel, une activité privée lucrative, sauf exceptions (CGFP, art. L.123-1)."
      - "La **production d’œuvres de l’esprit** (écrire, composer, créer…) **s’exerce librement**, dans le respect de la discrétion et du secret professionnels (art. L.123-2)."
      - "Une **activité accessoire** (par exemple des cours ailleurs) peut être **autorisée** par votre hiérarchie si elle est compatible avec vos fonctions et figure sur la liste des activités autorisées (art. L.123-7)."
    textes:
      - "Le décret n° 2017-105 cité par d’anciennes publications a été **abrogé** : les règles sont désormais dans le Code général de la fonction publique (art. L.123-1 à L.123-8) et le décret n° 2020-69 du 30 janvier 2020."
      - "Il est interdit de cumuler deux emplois permanents à temps complet (art. L.123-1, 5°)."
    agir:
      - "Demandez l’autorisation **avant** de commencer, avec l’imprimé académique de demande de cumul."
    source: { doc: cgfp, ref: "art. L.123-1 à L.123-8" }

  - id: elections-professionnelles
    titre: "Élections professionnelles : du 3 au 10 décembre 2026"
    resume: "Vote électronique pour élire vos représentant·es."
    en_bref:
      - "Le **vote électronique** a lieu **du 3 au 10 décembre 2026**."
      - "Vous élisez vos représentant·es aux **CSA** (comités sociaux d’administration), aux **CAP** (commissions administratives paritaires) et aux **CCP** (pour les contractuel·les)."
      - "Ces élu·es vous défendent sur les mutations, les carrières, les conditions de travail et la santé au travail."
    agir:
      - "Vérifiez dès maintenant que vous avez accès à votre messagerie professionnelle : c’est là que vous recevrez vos identifiants."
      - "Votez, et faites voter autour de vous !"
    source: { doc: abecedaire, pages: "11" }
