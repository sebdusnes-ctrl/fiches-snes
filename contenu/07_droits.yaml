theme:
  id: droits
  titre: "Droits syndicaux et libertés"
  description: "Heure d’info syndicale, stages, devoir de réserve, cumul, élections."
  couleur: "#ed0f4c"

fiches:
  - id: heure-information-syndicale
    titre: "L’heure d’information syndicale (HIS)"
    resume: "Une heure par mois sur le temps de service, sans autorisation de la direction."
    en_bref:
      - "Chaque agent public, **titulaire ou non, enseignant·e ou non**, a droit à **une heure par mois** de réunion d’information syndicale sur son temps de service (CGFP, art. R.215-12)."
      - "**Ce n’est pas une décision commune** : c’est le code qui « autorise » les syndicats représentatifs à tenir ces réunions pendant les heures de service (CGFP, art. R.213-40). La section **prévient par écrit** la direction au moins une semaine avant (art. R.213-39), sans avoir à donner l’ordre du jour. La « concertation » (circulaire n° 2014-120) porte sur la prise en charge des élèves : **la direction n’a pas à l’autoriser**, et un désaccord sur la date ou l’horaire n’est pas un motif de refus."
      - "**Enseignant·es** : vous devez **prévenir le chef d’établissement au moins 48 heures avant** si vous souhaitez y participer (même circulaire). Autres personnels : pas de délai."
    textes:
      - "Le code demande seulement que l’établissement reste ouvert et fonctionne (CGFP, art. R.213-38). **En début ou en fin de demi-journée**, la vie scolaire gère les élèves : la nécessité de service ne peut être invoquée. En dernière heure, la réunion peut déborder après le service (circulaire n° 2014-120)."
      - "Un·e **représentant·e syndical·e extérieur·e** mandaté·e peut animer la réunion : direction informée **24 h avant** (CGFP, art. R.213-36)."
      - "**AED, AESH** : même droit ; prévenez le ou la CPE. La prise en charge des élèves revient à la direction, qui a la main sur les solutions : libérer des classes, banaliser l’heure… Situation vraiment compliquée (demi-pension) : les AED décident entre eux qui va à la réunion ; une 2e réunion reste le dernier recours (circulaire n° 2014-120). **Pressions, menace sur le contrat** : discrimination syndicale interdite (CGFP, art. L.131-1). Notez les faits, contactez la section."
      - "**Avant les élections professionnelles** (six semaines avant le scrutin), chaque agent peut assister en plus à une réunion d’information spéciale d’une heure (CGFP, art. R.215-14)."
    agir:
      - "Dates des HIS : panneau syndical. Prévenez la direction 48 h avant par écrit (un courriel suffit), et vos élèves si vous avez cours."
      - "Refus de la direction, ou « pas d’accord sur l’horaire » : demandez-le par écrit avec le texte invoqué, et contactez la section."
    liens:
      - { libelle: "Le droit syndical dans l’établissement", url: "https://www.snes.edu/agissons/outils/le-droit-syndical-dans-l-etablissement" }
    source:
      - { doc: cgfp, ref: "art. L.131-1, R.213-36 à R.213-40, R.215-12 à R.215-14" }
      - { doc: circ_his, ref: "1 et 2.2" }
      - { doc: abecedaire, pages: "15" }

  - id: stage-syndical
    titre: "Stage de formation syndicale : 12 jours par an"
    resume: "Un droit pour tout agent en activité, adhérent·e ou non. Demande écrite un mois avant."
    en_bref:
      - "Tout agent public en activité, **titulaire ou contractuel**, a droit à un congé pour formation syndicale **avec traitement**, de **12 jours ouvrables par an** au plus (CGFP, art. L.215-1)."
      - "**Une formation sur le temps de service** : le ministère pousse à organiser la formation continue (PAF) **hors du face-à-face pédagogique** (le soir, le mercredi, à distance en asynchrone). Le stage syndical est désormais quasiment la seule formation qui se déroule sur le temps de service."
      - "La demande est adressée **par écrit au moins un mois avant** le stage. **Sans réponse le 15e jour avant le stage, le congé est accordé** (art. R.215-3)."
      - "Il ne peut être refusé que si **les nécessités du fonctionnement du service** s’y opposent (art. R.215-4). Le refus doit être **écrit et motivé** (code des relations entre le public et l’administration, art. L.211-2 et L.211-5) et communiqué à la commission paritaire. Un refus oral, ou après le 15e jour avant le stage, est sans effet."
    textes:
      - "Le stage doit être organisé par un centre ou institut figurant sur une liste arrêtée par le ministre (art. R.215-1). La section vous indique les modalités pour chaque stage."
      - "À la fin du stage, une attestation de présence vous est remise : conservez-la."
    agir:
      - "Choisissez un stage dans la liste ci-dessous, inscrivez-vous (adhérent·e ou non), puis envoyez votre demande d’absence un mois avant."
      - "Refus : demandez-en le motif écrit et contactez la section."
    liens:
      - { libelle: "Calendrier des stages et disponibilités (vérifié chaque jour)", url: "https://sebdusnes-ctrl.github.io/fiches-snes/stages.html" }
      - { libelle: "Stages du SNES-FSU Lille 2026-2027 (liste et programmes)", url: "https://lille.snes.edu/Stages-SNES-FSU-2026-2027.html" }
      - { libelle: "Inscription en ligne, ouverte aux non-adhérent·es", url: "https://adherent.snes.edu/Public/indexStages.php?Aca=15" }
      - { libelle: "Stages FSU 59/62 2026-2027", url: "https://lille.snes.edu/Stages-FSU-59-62-2026-2027.html" }
    source:
      - { doc: cgfp, ref: "art. L.215-1, R.215-1 à R.215-5" }
      - { doc: crpa, ref: "art. L.211-2 et L.211-5" }
      - { doc: reunions }

  - id: devoir-de-reserve
    titre: "Obéir, se conformer, « devoir de réserve » : ce que dit vraiment le droit"
    resume: "Les militaires obéissent. Les professeur·es se conforment aux instructions, avec la liberté pédagogique dans la manière d’y parvenir."
    en_bref:
      - "**Les militaires obéissent** : ils « doivent obéissance aux ordres de leurs supérieurs » (code de la défense, art. L.4122-1)."
      - "**Les agents publics se conforment** : « L’agent public doit **se conformer aux instructions** de son supérieur hiérarchique, sauf dans le cas où l’ordre donné est manifestement illégal et de nature à compromettre gravement un intérêt public » (CGFP, art. L.121-10). Le mot « obéissance » ne figure pas dans le statut."
      - "**Les professeur·es gardent la liberté de la manière** : « la liberté pédagogique de l’enseignant s’exerce dans le respect des programmes et des instructions » (code de l’éducation, art. L.912-1-1). Le conseil pédagogique ne peut y porter atteinte."
    textes:
      - "**Pas de « devoir de réserve » dans le statut** : le Code général de la fonction publique n’en parle pas. C’est une construction de la jurisprudence, appréciée au cas par cas et bien plus stricte pour les hauts fonctionnaires qui représentent l’État. La liberté d’opinion est garantie (art. L.111-1)."
      - "Le code impose en revanche : dignité, impartialité, intégrité et probité (art. L.121-1) ; neutralité et laïcité dans l’exercice des fonctions (art. L.121-2) ; discrétion professionnelle (art. L.121-7) ; secret professionnel (art. L.121-6)."
      - "Une instruction doit rester dans le cadre de vos missions et de votre statut. Hors du cas d’un ordre manifestement illégal, on s’y conforme d’abord, puis on la conteste."
    agir:
      - "Si l’on vous oppose un « devoir de réserve », de « loyauté » ou d’« obéissance », demandez sur quel texte il repose."
      - "Instruction qui touche à vos choix pédagogiques ou sort de vos missions : demandez-la par écrit et contactez la section."
    source:
      - { doc: cgfp, ref: "art. L.111-1, L.121-1 à L.121-10" }
      - { doc: code_education, ref: "art. L.912-1-1" }
      - { doc: code_defense, ref: "art. L.4122-1" }
      - { doc: obeissance, ref: "3 pages" }

  - id: cumul-activites
    titre: "Cumul d’activités : ce qui est permis"
    resume: "Les œuvres de l’esprit sont libres. Une activité accessoire, comme des cours, demande une autorisation."
    en_bref:
      - "Un agent public ne peut pas exercer, à titre professionnel, une activité privée lucrative, sauf exceptions (CGFP, art. L.123-1)."
      - "La **production d’œuvres de l’esprit** (écrire, composer, créer…) **s’exerce librement**, dans le respect de la discrétion et du secret professionnels (art. L.123-2)."
      - "Une **activité accessoire** (par exemple des cours ailleurs) peut être **autorisée** par votre hiérarchie si elle est compatible avec vos fonctions et figure sur la liste des activités autorisées (art. L.123-7)."
    textes:
      - "Le décret n° 2017-105 cité par d’anciennes publications a été **abrogé** : les règles sont désormais dans le Code général de la fonction publique (art. L.123-1 à L.123-8) et le décret n° 2020-69 du 30 janvier 2020."
      - "Il est interdit de cumuler deux emplois permanents à temps complet (art. L.123-1, 5°)."
    agir:
      - "Demandez l’autorisation **avant** de commencer, avec l’imprimé académique de demande de cumul."
    source:
      - { doc: cgfp, ref: "art. L.123-1 à L.123-8" }

  - id: elections-professionnelles
    titre: "Élections professionnelles : du 3 au 10 décembre 2026"
    resume: "Vote électronique pour élire vos représentant·es."
    en_bref:
      - "Le **vote électronique** a lieu **du 3 au 10 décembre 2026**."
      - "Vous élisez vos représentant·es aux **CSA** (comités sociaux d’administration), aux **CAP** (commissions administratives paritaires) et aux **CCP** (pour les contractuel·les)."
      - "Ces élu·es vous défendent sur les mutations, les carrières, les conditions de travail et la santé au travail."
    agir:
      - "Vérifiez dès maintenant que vous avez accès à votre messagerie professionnelle : c’est là que vous recevrez vos identifiants."
      - "Votez, et faites voter autour de vous !"
    source:
      - { doc: abecedaire, pages: "11" }

  - id: faire-greve
    titre: "Faire grève"
    resume: "Un droit, sans déclaration préalable dans le second degré ; un trentième retenu par jour de grève."
    en_bref:
      - "« Les agents publics exercent le droit de grève dans le cadre des lois qui le réglementent » (CGFP, art. L.114-1), titulaires ou non, AED et AESH compris. Le préavis est déposé **par un syndicat**, cinq jours francs avant (code du travail, art. L.2512-2) : vous pouvez alors faire grève, même seul·e dans votre établissement."
      - "**Pas de déclaration préalable** : le SNES-FSU rappelle que l’obligation de prévenir à l’avance ne concerne que les enseignant·es du premier degré. La direction n’a pas à vous demander si vous ferez grève."
      - "**Retenue** : toute absence de service fait pendant une journée, même d’une heure, entraîne la retenue d’**un trentième** de la rémunération, sauf supplément familial et remboursements de frais (CGFP, art. L.711-3). Elle s’applique aussi à l’ISOE et aux HSA."
    textes:
      - "C’est l’administration qui relève les grévistes, à partir du service non fait. On n’a pas à se déclarer après coup, et une liste de grévistes ne s’affiche pas."
      - "**Grève sur plusieurs jours** (arrêt Omont, 1978) : l’administration peut retenir tous les jours entre le début de la grève et votre reprise effective, y compris ceux où vous n’aviez pas cours. En revanche, une grève le vendredi suivie d’une reprise le lundi ne justifie pas de retenir le week-end."
      - "Se déclarer publiquement gréviste un jour sans cours entraîne aussi une retenue (arrêt Tinel, 1988)."
    agir:
      - "Après une grève, demandez la copie de ce qui a été déclaré vous concernant : elle permet de vérifier, et de faire corriger, les retenues."
      - "On vous demande à l’avance si vous ferez grève ? Vous pouvez ne pas répondre ; prévenez la section en cas d’insistance."
      - "Grève reconductible, veille de vacances : demandez conseil à la section avant de reprendre."
    source:
      - { doc: cgfp, ref: "art. L.114-1, L.114-2, L.711-3" }
      - { doc: snes_greve }
      - { doc: snes_lille_omont }
