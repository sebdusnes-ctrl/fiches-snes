theme:
  id: carriere
  titre: "Carrière"
  description: "Rendez-vous de carrière, hors-classe, classe exceptionnelle."
  couleur: "#ed0f4c"

fiches:
  - id: rendez-vous-de-carriere
    titre: "Les rendez-vous de carrière"
    resume: "Trois évaluations aux 6e, 8e et 9e échelons, qui pèsent sur votre avancement."
    en_bref:
      - "En classe normale, trois **rendez-vous de carrière** ont lieu, au cours des **6e, 8e et 9e échelons**."
      - "Ils servent à l’évaluation professionnelle. L’administration s’en sert aussi pour **accélérer un avancement d’échelon** ou pour la **promotion à la hors-classe**."
      - "Un rendez-vous comprend une inspection, des entretiens, puis un compte rendu avec une appréciation finale."
    textes:
      - "Les éléments de l’évaluation professionnelle peuvent faire l’objet d’une **demande de révision**, puis d’un recours devant la CAP."
    agir:
      - "Relisez votre compte rendu dès qu’il vous est notifié et notez la date : les délais de recours partent de là."
      - "Avant le rendez-vous comme après, la section peut vous aider à le préparer ou à rédiger un recours."
    snes: "Le SNES-FSU défend la liberté pédagogique et la séparation entre l’évaluation et le déroulement de carrière."
    liens:
      - { libelle: "Rendez-vous de carrière : le dossier du SNES-FSU", url: "https://r.snes.edu/RendezVousDeCarriere" }
    source:
      - { doc: abecedaire, pages: "22" }
      - { doc: memo_tzr, pages: "11" }

  - id: promotions-de-grade
    titre: "Échelons, hors-classe, classe exceptionnelle"
    resume: "Comment progresse votre carrière, et qui peut être promu."
    en_bref:
      - "Trois grades : la **classe normale**, la **hors-classe** (accessible à toutes et à tous avant la retraite) et la **classe exceptionnelle**."
      - "Hors-classe : 23 % des promouvables sont promu·es en 2025 et 2026 (contre 18 % en 2022)."
      - "Classe exceptionnelle : promouvable à partir du **5e échelon de la hors-classe** (4e pour les agrégé·es). Ratios : 9,5 % pour les certifié·es, CPE et Psy-ÉN, 13,5 % pour les agrégé·es."
    textes:
      - "Le droit à la carrière est statutaire. Les règles d’avancement sont les mêmes pour toutes et tous."
      - "Protocole PPCR (2017) : une carrière complète doit se dérouler sur au moins deux grades."
    agir:
      - "Vérifiez chaque année sur I-Prof si vous êtes promouvable et ce que contient votre dossier."
      - "Faites vérifier votre situation par la section au moment des campagnes de promotion."
    snes: "Le SNES-FSU demande que l’accès à la classe exceptionnelle devienne la norme en fin de carrière."
    liens:
      - { libelle: "Mémo rémunérations et carrières (SNES-FSU)", url: "https://r.snes.edu/RemuneraCarrieres" }
    source:
      - { doc: abecedaire, pages: "6, 21" }

  - id: temps-partiel-disponibilite
    titre: "Temps partiel et disponibilité"
    resume: "Temps partiel de droit ou sur autorisation ; quelle rémunération, quels effets sur la carrière et la retraite."
    en_bref:
      - "**Sur autorisation** : un service à temps partiel, au moins un mi-temps, « sous réserve des nécessités » du service. Un refus doit être **précédé d’un entretien et motivé** (CGFP, art. L.612-1 et L.612-2)."
      - "**De droit** (50, 60, 70 ou 80 %) : après chaque naissance ou adoption, jusqu’aux trois ans de l’enfant ou trois ans après l’arrivée au foyer, ou pour donner des soins à un proche handicapé, malade ou accidenté (art. L.612-3). Demande deux mois avant au moins."
      - "**Carrière** : le temps partiel compte comme du temps plein pour l’avancement, la promotion et la formation (art. L.612-4)."
    textes:
      - "**Paie** : au prorata du service ; à 80 %, six septièmes (85,7 %), à 90 %, 32/35 (91,4 %) (art. L.612-5). Pour un service en heures entre 80 et 90 % (15 h sur 18, par exemple), la paie suit la formule (quotité × 4/7) + 40 (décret n° 82-624, art. 1)."
      - "L’autorisation est accordée pour six mois à un an (en pratique, l’année scolaire), reconduite tacitement dans la limite de trois ans. Retour à temps plein possible en cours d’année pour motif grave (art. 2)."
      - "**Retraite** : le temps partiel compte comme du temps plein pour la durée d’assurance, mais au prorata pour la pension, sauf temps partiel de droit pour un enfant de moins de trois ans. Une surcotisation est possible, dans la limite de quatre trimestres (37,65 % en 2026)."
      - "**Disponibilité** de droit, trois ans renouvelables : pour élever un enfant de moins de 12 ans, donner des soins à un proche, suivre son ou sa conjoint·e (décret n° 85-986, art. 47). Sur demande : convenances personnelles (cinq ans, dix ans sur la carrière), études, création d’entreprise (art. 44 et 46). Pas de traitement ; avancement conservé cinq ans au plus si vous travaillez ou élevez un enfant (CGFP, art. L.514-2)."
    agir:
      - "Faites la demande dans les délais fixés chaque année par le rectorat : la section vous les communique."
      - "Refus : demandez l’entretien et le motif écrit ; la commission paritaire peut être saisie (art. L.612-13)."
    source:
      - { doc: cgfp, ref: "art. L.514-1 à L.514-4, L.612-1 à L.612-13" }
      - { doc: decret_temps_partiel, ref: "art. 1 et 2" }
      - { doc: decret_85_986, ref: "art. 44, 46, 47" }
      - { doc: snes_tp_retraite }

  - id: formation-cpf
    titre: "Formation continue, CPF, congé de formation"
    resume: "Sur instruction : pendant le service. Hors service : avec votre accord écrit. 25 h de CPF par an."
    en_bref:
      - "Les formations suivies **sur instruction de l’administration** se déroulent **pendant le temps de service** (CGFP, art. R.422-51). En dehors, il faut **votre accord écrit**, dans la limite de 50 ou 80 heures par an selon la formation (art. R.422-52)."
      - "**Compte personnel de formation (CPF)** : 25 heures par an, jusqu’à 150 heures (art. R.422-84), pour un projet d’évolution professionnelle. Il s’utilise avec l’accord de l’administration, en priorité pendant le temps de travail ; un refus doit être motivé (art. L.422-9 et L.422-11)."
      - "**Congé de formation professionnelle** : trois ans au plus sur la carrière (art. R.422-116), avec une indemnité de 85 % du traitement pendant douze mois, plafonnée à l’indice brut 650 (art. R.422-118). Demande au moins **120 jours** avant (art. R.422-112), dans la limite des crédits (art. R.422-110)."
    textes:
      - "Sans aucune formation du plan académique depuis trois ans, l’accès à une action de ce plan est **de droit** ; il ne peut être différé que d’un an (art. R.422-53)."
      - "Après deux refus consécutifs de CPF, un troisième refus pour une formation de même nature exige l’avis de l’instance paritaire (art. L.422-13)."
      - "Ces règles ont été intégrées au Code général de la fonction publique le 1er août 2026 (décret n° 2026-366)."
    agir:
      - "Une formation hors temps de service vous est imposée ? Rappelez l’article R.422-52 : sans accord écrit, elle ne peut pas l’être."
      - "Refus de CPF ou de congé de formation : demandez le motif écrit et contactez la section ; la commission paritaire peut être saisie."
    snes: "Le SNES-FSU rappelle que la formation continue fait partie du temps de travail et revendique qu’elle se déroule sur le temps de service."
    source:
      - { doc: cgfp, ref: "art. L.422-1, L.422-8 à L.422-13, R.422-51 à R.422-53, R.422-84, R.422-110 à R.422-118" }
      - { doc: reunions }

  - id: professeurs-contractuels
    titre: "Professeur·es contractuel·les : vos droits"
    resume: "Contrat, rémunération, renouvellement, CDI après six ans : l’essentiel."
    en_bref:
      - "Recruté·e par le recteur, vous avez **les mêmes obligations de service** que les titulaires (décret n° 2016-1171, art. 3 et 14) et **les mêmes primes et indemnités** (ISOE, REP…), sauf exception réservée aux fonctionnaires (art. 11)."
      - "Pour un besoin couvrant l’année scolaire, le contrat court jusqu’à **la veille de la rentrée suivante**, donc vacances d’été comprises (art. 4)."
      - "**CDI** : après six ans de services publics dans la même catégorie et auprès du même ministère, le contrat suivant est conclu pour une durée indéterminée (CGFP, art. L.332-4)."
    textes:
      - "Le contrat précise vos fonctions, votre établissement et la quotité de travail (art. 6). La rémunération est **réévaluée au moins tous les trois ans** (art. 10)."
      - "**Renouvellement** : l’administration doit vous dire si elle renouvelle votre contrat au plus tard 8 jours avant son terme (moins de 6 mois), un mois (moins de 2 ans), deux mois (2 ans et plus) ou trois mois s’il peut devenir un CDI (CGFP, art. R.332-27)."
      - "Contrat d’un an au plus et faible rémunération : une **indemnité de fin de contrat** peut être due (art. L.554-3)."
      - "La **commission consultative paritaire** (CCP) peut être saisie notamment en cas de refus de temps partiel, de congé de formation ou de CPF ; elle est consultée avant tout licenciement."
    agir:
      - "Vérifiez votre classement et votre première paie : les erreurs sont fréquentes et souvent rattrapables."
      - "Fin de contrat : inscrivez-vous sans attendre auprès de France Travail."
      - "Accident, arrêt maladie : voir [« Accident de service, CITIS »](fiche:accident-de-service)."
    snes: "Le SNES-FSU, avec la FSU, revendique une grille nationale de rémunération et un plan de titularisation."
    source:
      - { doc: decret_contractuels_en, ref: "art. 3 à 14" }
      - { doc: cgfp, ref: "art. L.332-4, L.554-3, R.332-27" }
      - { doc: snes_nontit, pages: "2 à 7" }

  - id: mutations-inter-2027
    titre: "Mutations 2027 : la phase inter"
    resume: "Vœux sur SIAM du 4 au 25 novembre 2026 (midi) ; confirmation dès le 26 novembre ; résultats le 10 mars 2027."
    a_jour: "Dates annoncées par le SNES-FSU avant la note de service (BO du 29 octobre 2026) : à vérifier à sa parution. Phase intra : calendrier du rectorat de Lille."
    en_bref:
      - "**Deux phases** : l’inter pour obtenir une académie (ministère), puis l’intra pour un poste dans l’académie (rectorat). Les stagiaires y participent pour leur première affectation."
      - "**Saisie des vœux sur SIAM** (via I-Prof) du **mercredi 4 novembre 2026, midi, au mercredi 25 novembre, midi**."
      - "**Confirmation** à télécharger dès le **26 novembre** : vérifiez-la, signez-la et déposez-la avec les pièces justificatives (Colibris ou chef·fe d’établissement selon l’académie), dans un délai très court."
    textes:
      - "**Priorités légales** du barème : rapprochement de conjoint·e (marié·e ou pacsé·e), handicap, exercice en quartier difficile, centre des intérêts matériels et moraux outre-mer, suppression de poste (CGFP, art. L.512-19)."
      - "Le barème affiché pendant la saisie **n’est pas définitif** : vérifié par l’administration, il est affiché sur I-Prof **courant janvier**, au moins deux semaines, pour demander une correction."
      - "**5 février 2027, 23 h 59** : date limite des demandes tardives, annulations et modifications (motifs limités). **10 mars** : résultats. Recours possible jusqu’au **9 mai**."
    agir:
      - "Remplissez la fiche de suivi syndicale en ligne et envoyez au SNES-FSU une copie de votre dossier (sans document médical)."
      - "Barème erroné sur la confirmation : corrigez-le en rouge ; vérifiez-le à nouveau en janvier."
      - "Participez aux réunions mutations du SNES-FSU Lille et contactez la section pour construire vos vœux."
    source:
      - { doc: snes_mutations, pages: "2 à 5" }
      - { doc: cgfp, ref: "art. L.512-18 à L.512-22" }

  - id: stagiaires
    titre: "Professeur·es stagiaires : vos droits"
    resume: "Service, formation, tuteur, titularisation : ce qu’on peut vous demander, et ce qu’on ne peut pas."
    en_bref:
      - "**Service** selon votre parcours : à temps plein (18 h certifié·e, 15 h agrégé·e, 30 + 6 h documentaliste, 35 h CPE) ou à mi-temps en alternance avec l’INSPÉ (8 à 10 h certifié·e, 7 à 9 h agrégé·e, 15 + 3 h documentaliste, 18 h CPE)."
      - "**Pas d’heures supplémentaires à l’année** : à mi-temps, aucune HSA, et aucune heure au-delà de la fourchette prévue. Les pondérations (REP+ : 1,1) comptent dans le service : vérifiez votre état VS."
      - "**Volontariat** : on ne peut pas vous imposer d’être professeur·e principal·e, ni d’assurer Devoirs faits au-delà de votre service."
    textes:
      - "**Formation** : 10 à 20 jours pour les stagiaires à temps plein, sur le temps de service et hors vacances ; elle est prioritaire sur toute autre obligation dans l’établissement."
      - "**Tutorat** : un·e tuteur·rice dans l’établissement pour tous ; un·e tuteur·rice INSPÉ en plus pour les stagiaires à mi-temps. Il est recommandé de ne pas confier plus de deux niveaux."
      - "**Titularisation** : le jury académique se prononce au vu des avis du chef d’établissement, de l’inspecteur·rice (sur rapport du tuteur ou après inspection) et, à mi-temps, de l’INSPÉ (notes de service n° 2015-055 et 2016-070). Il reçoit en entretien les stagiaires qu’il envisage de ne pas titulariser."
    agir:
      - "Demandez à connaître les avis vous concernant avant le jury."
      - "Première affectation : voir [« Mutations 2027 »](fiche:mutations-inter-2027)."
      - "Difficulté, avis défavorable annoncé : contactez la section sans attendre."
    source:
      - { doc: snes_stagiaires, pages: "8 à 20" }
      - { doc: decret_ors, ref: "art. 2" }
