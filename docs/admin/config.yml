      label: Fiches
      widget: list
      summary: '{{fields.titre}}'
      fields: *id002
  - name: 04_carriere
    label: Carrière
    file: contenu/04_carriere.yaml
    fields:
    - *id001
    - name: fiches
      label: Fiches
