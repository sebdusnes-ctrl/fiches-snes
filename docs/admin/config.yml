  - name: 08_eleves
    label: Élèves à besoins particuliers
    file: contenu/08_eleves.yaml
    fields:
    - *id001
    - name: fiches
      label: Fiches
      widget: list
      summary: '{{fields.titre}}'
      fields: *id002
  - name: 08b_aed_aesh
    label: AED et AESH
    file: contenu/08b_aed_aesh.yaml
    fields:
    - *id001
    - name: fiches
      label: Fiches
      widget: list
      summary: '{{fields.titre}}'
